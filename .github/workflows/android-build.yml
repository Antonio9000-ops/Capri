# .github/workflows/android-build.yml
name: Build Capri APK

on:
  push:
    branches: ["main"]
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Dar permisos de ejecución al Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Ejecutar tests del motor
        run: ./gradlew testDebugUnitTest

      - name: Compilar APK de Debug
        run: ./gradlew assembleDebug

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: capri-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
